services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092'
      KAFKA_BROKER_ID: 1

    volumes:
      - ./infra/kafka/config.txt:/tmp/config.txt

  producer:
    depends_on: 
      - kafka
    build:
      context: src/producer/
    volumes:
      - ./src/producer/app:/src/app
    restart: unless-stopped

  spark-master:
    depends_on:
      - kafka
      - influxdb
    ports:
      - 8088:8080
      - 7077:7077
    build:
      context: src/spark-processor/
    volumes:
      - ./src/spark-processor/app:/src/app
    environment:
      SPARK_PUBLIC_DNS: "192.168.0.15"
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
  
  spark-worker1:
    depends_on:
      - spark-master
    ports:
      - 8089:8081
    build:
      context: src/spark-processor/
    volumes:
      - ./src/spark-processor/app:/src/app
    environment:
      SPARK_WORKER_DIR: "/opt/spark/work-dir"
      SPARK_PUBLIC_DNS: "192.168.0.15"
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-processor:
    build:
      context: src/spark-processor/
    depends_on:
      - spark-master
    ports:
      - 4040:4040
    environment:
      SPARK_PUBLIC_DNS: "192.168.0.15"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["/opt/spark/bin/spark-submit", "--conf", "spark.ui.port=4040", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.iceberg:iceberg-spark-runtime-3.4_2.12:1.10.0,org.postgresql:postgresql:42.7.8", "/src/app/processor.py"]

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
    ports:
      - 8086:8086
    volumes:
      - ./data/influxdb/data:/var/lib/influxdb2
      - ./data/influxdb/config:/etc/influxdb2

  grafana:
    image: grafana/grafana:11.6.3
    user: root
    depends_on:
      - influxdb
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./data/grafana:/var/lib/grafana
    command: >
      sh -c "chown -R 472:472 /var/lib/grafana && /run.sh"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./data/minio/data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
  
  postgres:
    image: postgres:14
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # --- A SEÇÃO DE RECURSOS PARA DOCKER COMPOSE ---
    deploy:
      resources:
        limits:
          cpus: '0.50'  # Limita a 50% de um núcleo de CPU
          memory: 1g   # Limita a 1 Gigabyte de RAM
        reservations:
          cpus: '0.25'  # Garante pelo menos 25% de um núcleo
          memory: 512m # Garante pelo menos 512 Megabytes de RAM
